
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cloudops-postgres-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudops-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudops-postgres
  template:
    metadata:
      labels:
        app: cloudops-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: cloudops
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cloudops-db-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              value: cloudops_db
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: cloudops-postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: cloudops-postgres
spec:
  type: ClusterIP
  selector:
    app: cloudops-postgres
  ports:
    - port: 5432
      targetPort: 5432
